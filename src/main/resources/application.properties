spring.application.name=employee-management
server.port=8080

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/employee_management}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=285736

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Change these values or set ADMIN_PASSWORD and EMPLOYEE_PASSWORD environment variables.
app.security.admin-password=${ADMIN_PASSWORD:Admin@123}
app.security.employee-password=${EMPLOYEE_PASSWORD:Employee@123}